name: Build Snowfall

'on':
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y git curl unzip build-essential fakeroot rsync perl zip libxml2 libtinfo6

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Install iOS SDK
        run: |
          mkdir -p "$HOME/theos/sdks"
          curl -fL https://github.com/theos/sdks/archive/refs/heads/master.zip -o /tmp/sdks.zip
          unzip -o /tmp/sdks.zip -d /tmp/sdks
          find /tmp/sdks -type d -name '*.sdk' -exec cp -r {} "$HOME/theos/sdks/" \;

      - name: Build Snowfall
        run: make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Snowfall-deb
          path: packages/*.deb
          if-no-files-found: error
