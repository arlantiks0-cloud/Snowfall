      - name: Install Theos and SDK
        run: |
          export THEOS="$HOME/theos"
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          mkdir -p "$THEOS/sdks"
          curl -fL https://github.com/theos/sdks/archive/refs/heads/master.zip -o /tmp/theos-sdks.zip
          sudo apt-get install -y unzip
          unzip -o /tmp/theos-sdks.zip -d /tmp/theos-sdks
          cp -r /tmp/theos-sdks/sdks-master/*.sdk "$THEOS/sdks/"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
